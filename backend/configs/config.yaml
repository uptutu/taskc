server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: 10s
  write_timeout: 10s

database:
  host: "localhost"
  port: 3306
  username: "taskc_user"
  password: "taskc_password_2024"
  dbname: "taskc"
  charset: "utf8mb4"
  parse_time: true
  loc: "Local"
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 3600s

redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0
  pool_size: 10
  max_retries: 3

heartbeat:
  timeout: 30s
  check_interval: 10s
  max_missed_beats: 3
  probe_timeout: 5s

log:
  level: "info"
  format: "json"
  output: "stdout"
  retention_days: 90
  cleanup_time: "02:00"
  disk_threshold: 85

alert:
  channels:
    sms:
      enabled: true
      rate_limit: 30
    email:
      enabled: true
      rate_limit: 100
      smtp_host: "smtp.gmail.com"
      smtp_port: 587
    slack:
      enabled: true
      rate_limit: 20
      webhook_url: ""

jwt:
  secret: "your-secret-key"
  expires_in: 24h