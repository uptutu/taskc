# Production Configuration for TaskC
# Copy this file to config/config.yaml and modify as needed

server:
  host: "0.0.0.0"
  port: 8080
  mode: "release"  # gin mode: debug, release, test
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 60s

database:
  host: "mysql"
  port: 3306
  name: "taskc"
  user: "taskc_user"
  password: "taskc_password_2024"
  charset: "utf8mb4"
  parse_time: true
  loc: "UTC"
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 1h

redis:
  host: "redis"
  port: 6379
  password: ""
  db: 0
  pool_size: 20
  min_idle_conns: 5
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s

logging:
  level: "info"  # debug, info, warning, error, fatal
  format: "json"  # text, json
  directory: "/app/logs"
  max_size: 100  # MB
  max_age: 30    # days
  max_backups: 10
  compress: true

heartbeat:
  timeout: 30s
  max_missed_beats: 3
  check_interval: 10s
  recovery_window: 5m

probe:
  timeout: 10s
  retry_count: 3
  retry_delay: 1s
  concurrent_limit: 50

alert:
  rate_limit: 100
  storm_threshold: 10
  storm_window: 1m
  channels:
    sms:
      rate_limit: 30
      provider: "default"
      api_key: ""
      api_secret: ""
    email:
      rate_limit: 100
      smtp_host: "smtp.gmail.com"
      smtp_port: 587
      username: ""
      password: ""
      from_email: "noreply@taskc.com"
      to_emails:
        - "admin@example.com"
    slack:
      rate_limit: 20
      webhook_url: ""

log_management:
  log_directory: "/app/logs"
  max_log_size: 104857600  # 100MB in bytes
  max_log_age: 24h
  compression_enabled: true
  retention_days: 30
  rotation_interval: 1h
  buffer_size: 1000
  flush_interval: 10s
  disk_threshold: 80
  cleanup_time: "02:00"

security:
  jwt_secret: "taskc_jwt_secret_change_in_production_2024"
  jwt_expiry: 24h
  api_rate_limit: 1000
  enable_cors: true
  allowed_origins:
    - "http://localhost:3000"
    - "https://taskc.local"
  trusted_proxies:
    - "nginx"

monitoring:
  enable_metrics: true
  metrics_path: "/metrics"
  enable_health_check: true
  health_check_path: "/health"
  enable_pprof: false
  pprof_path: "/debug/pprof"